/**:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    controller_frequency: 8.0 # Daha hassas kontrol için artırıldı
    oscillation_distance: 0.2   # 50cm içinde sürekli yön değiştirirse durur, saçmalamaz.
    oscillation_timeout: 15.0    # Saçmalama süresi sınırı.
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    use_realtime_priority: true
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 3.14
      latch_xy_goal_tolerance: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      max_linear_accel: 0.4
      max_linear_decel: -0.4
      min_linear_velocity: 0.1
      min_theta_velocity: 0.1
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.5
      lookahead_time: 1.5
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.4
      allow_reversing: true
      use_collision_detection: true
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.10

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 3.0
      transform_tolerance: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[-0.5, -0.33], [-0.5, 0.33], [0.5, 0.33], [0.5, -0.33]]'
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 3.5
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          min_obstacle_range: 0.05
          clearing: true
          marking: true
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
          observation_persistence: 0.0
          inf_is_valid: true
          data_type: "LaserScan"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 0.5
      publish_frequency: 1.0
      global_frame: map
      rolling_window: false
      transform_tolerance: 1.0
      width: 60    
      height: 60
      origin_x: -30.0
      origin_y: -30.0
      robot_base_frame: base_link
      footprint: '[[-0.5, -0.33], [-0.5, 0.33], [0.5, 0.33], [0.5, -0.33]]'
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          obstacle_max_range: 3.5
          observation_persistence: 0.0
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.1
      allow_unknown: true
      max_iterations: 1000000
      cost_travel_multiplier: 5.0
      travel_cost_power: 3.0
      use_final_approach_orientation: false # Hedefte gereksiz dönmeleri engellemek için eklenebilir

behavior_server:
  ros__parameters:
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    odom_frame: odom
    robot_base_frame: base_link
    
lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ['controller_server', 'planner_server', 'behavior_server', 'bt_navigator', 'waypoint_follower']    
